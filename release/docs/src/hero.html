<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-print-color-adjust:exact; }
  html,body { width:1600px; height:560px; overflow:hidden; }
  body {
    font-family:"Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
    background:radial-gradient(120% 140% at 15% 10%, #2f2d2a 0%, #232220 55%, #1b1a18 100%);
    color:#EDEAE2; display:flex; align-items:center; gap:40px; padding:0 64px;
  }
  .left { flex:1; max-width:840px; }
  .brand { display:flex; align-items:center; gap:16px; margin-bottom:26px; }
  .brand .name { font-size:26px; font-weight:700; letter-spacing:.01em; color:#F5F2EA; }
  h1 { font-size:52px; line-height:1.08; font-weight:700; letter-spacing:-.02em; color:#F5F2EA; }
  h1 em { font-style:normal; color:#D97757; }
  .sub { font-size:19px; line-height:1.5; color:#C9C3B6; margin-top:20px; max-width:660px; font-weight:500; }
  .chips { display:flex; gap:10px; margin-top:26px; flex-wrap:wrap; }
  .chip { border:1px solid rgba(217,119,87,.6); color:#E8A87C; font-size:12.5px; letter-spacing:.08em;
          padding:6px 13px; border-radius:20px; font-weight:600; }
  .phones { display:flex; align-items:center; }
  .phones img { height:452px; border-radius:20px; border:1px solid #45423e;
                box-shadow:0 24px 55px rgba(0,0,0,.6); display:block; }
  .phones img:nth-child(1){ transform:rotate(-5deg); z-index:1; margin-right:-40px; }
  .phones img:nth-child(2){ transform:translateY(-14px); z-index:3; }
  .phones img:nth-child(3){ transform:rotate(5deg); z-index:1; margin-left:-40px; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg width="46" height="46" viewBox="-50 -50 100 100">
        <circle r="48" fill="#D2775A"/><circle r="31" fill="#F2EFE6"/><path d="M0 0 L0 -31 A31 31 0 0 0 -27 15.5 Z" fill="#E0A38C"/>
      </svg>
      <div class="name">Claude Cooldown</div>
    </div>
    <h1>Your Claude limits,<br>on your <em>home screen</em>.</h1>
    <div class="sub">Live 5-hour &amp; 7-day usage for your Personal and Work accounts — with burn-rate forecasts and alerts before you hit the wall. Android, free, no servers.</div>
    <div class="chips">
      <span class="chip">LIVE WIDGETS</span><span class="chip">BURN-RATE FORECAST</span><span class="chip">SMART ALERTS</span><span class="chip">PERSONAL + WORK</span>
    </div>
  </div>
  <div class="phones">
    <img src="shots/quick-settings-tiles.png">
    <img src="shots/work-tab-final.png">
    <img src="shots/widget-large-dark.png">
  </div>
</body>
</html>
