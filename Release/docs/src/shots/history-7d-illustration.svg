<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 680" font-family="Roboto, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="320" height="680" fill="#0d0d0d"/>
  <!-- ILLUSTRATION badge -->
  <rect x="196" y="14" width="112" height="24" rx="12" fill="#000000" opacity="0.55"/>
  <rect x="196" y="14" width="112" height="24" rx="12" fill="none" stroke="#E59980" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="252" y="30" text-anchor="middle" fill="#E59980" font-size="10" letter-spacing="1.5">ILLUSTRATION</text>

  <text x="20" y="34" fill="#f2f2f2" font-size="20">Usage history</text>

  <!-- tabs -->
  <text x="90" y="86" text-anchor="middle" fill="#E59980" font-size="14">Personal</text>
  <text x="232" y="86" text-anchor="middle" fill="#8a8a8a" font-size="14">Work</text>
  <rect x="28" y="98" width="124" height="2" fill="#E59980"/>
  <rect x="0" y="99" width="320" height="1" fill="#2a2a2a"/>

  <!-- chips (7-day selected) -->
  <rect x="20" y="118" width="78" height="30" rx="15" fill="none" stroke="#555" stroke-width="1"/>
  <text x="59" y="138" text-anchor="middle" fill="#cfcfcf" font-size="13">5-hour</text>
  <rect x="106" y="118" width="70" height="30" rx="15" fill="#4a4458"/>
  <text x="141" y="138" text-anchor="middle" fill="#f2f2f2" font-size="13">7-day</text>

  <!-- card -->
  <rect x="12" y="162" width="296" height="256" rx="16" fill="#262626"/>

  <g font-size="12">
    <!-- 1 17-23 Jul now 71% -->
    <text x="26" y="212" fill="#d0d0d0">17&#8211;23 Jul</text>
    <text x="26" y="227" fill="#E59980" font-size="10">now</text>
    <rect x="120" y="211" width="134" height="14" rx="7" fill="#E59980" opacity="0.22"/>
    <rect x="120" y="211" width="95" height="14" rx="7" fill="#E59980"/>
    <text x="298" y="221" text-anchor="end" fill="#b0b0b0">71%</text>
    <!-- 2 10-16 Jul 100% -->
    <text x="26" y="270" fill="#d0d0d0">10&#8211;16 Jul</text>
    <rect x="120" y="263" width="134" height="14" rx="7" fill="#FF5252" opacity="0.25"/>
    <rect x="120" y="263" width="134" height="14" rx="7" fill="#FF5252"/>
    <text x="298" y="273" text-anchor="end" fill="#FF8A80">100%</text>
    <!-- 3 3-9 Jul 62% -->
    <text x="26" y="322" fill="#d0d0d0">3&#8211;9 Jul</text>
    <rect x="120" y="315" width="134" height="14" rx="7" fill="#E59980" opacity="0.22"/>
    <rect x="120" y="315" width="83" height="14" rx="7" fill="#E59980"/>
    <text x="298" y="325" text-anchor="end" fill="#b0b0b0">62%</text>
    <!-- 4 26 Jun-2 Jul 44% -->
    <text x="26" y="374" fill="#d0d0d0">26 Jun&#8211;2 Jul</text>
    <rect x="120" y="367" width="134" height="14" rx="7" fill="#E59980" opacity="0.22"/>
    <rect x="120" y="367" width="59" height="14" rx="7" fill="#E59980"/>
    <text x="298" y="377" text-anchor="end" fill="#b0b0b0">44%</text>
  </g>

  <text x="20" y="452" fill="#8a8a8a" font-size="12">History is recorded as each window closes, so it</text>
  <text x="20" y="470" fill="#8a8a8a" font-size="12">fills in over time.</text>
</svg>
